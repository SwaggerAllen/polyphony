# DigitalOcean App Platform spec for Polyphony.
#
# Deploys the Phoenix release built by the repo Dockerfile: a PRE_DEPLOY job runs
# migrations + event-store setup, then the web service boots. Create the app once:
#
#     doctl apps create --spec .do/app.yaml
#
# then set DO_APP_ID (the new id) and thereafter `deploy.yml` keeps it in sync.
# See docs/deployment.md.

name: polyphony
region: nyc

services:
  - name: web
    dockerfile_path: Dockerfile
    github:
      repo: SwaggerAllen/polyphony
      branch: main
      deploy_on_push: false
    run_command: bin/server
    http_port: 4000
    instance_size_slug: basic-xs
    instance_count: 1
    health_check:
      http_path: /
      # Generous window: migrate-on-boot runs before the endpoint serves, and on a
      # constrained DB it may retry through a connection crunch. Don't kill the
      # instance mid-migration.
      initial_delay_seconds: 90
      period_seconds: 15
      failure_threshold: 12
    envs:
      - key: SECRET_KEY_BASE
        scope: RUN_TIME
        type: SECRET
      # The design-kit catalogue at /storybook. RUN_TIME on purpose and it has to be:
      # the routes are gated per request, so this takes effect on a restart with no
      # rebuild. (It was a compile-time flag once, which meant setting it here stopped
      # the app booting — see the router.)
      #
      # **On in prod, deliberately.** It is how the design thread sees composed screens
      # in every state — including the empty and failed ones a live site would never
      # happen to be in — which is what keeps design work off a session token for the
      # real app. That only stays safe because storybook **reads no domain data**: every
      # story renders from fixture assigns. A story that loads a campaign would turn this
      # flag into an authorization hole, so don't write one.
      #
      # This value is authoritative: `deploy.yml` syncs the app to this spec, so flipping
      # it in the DigitalOcean UI is reverted on the next deploy.
      - key: STORYBOOK
        scope: RUN_TIME
        value: "true"
      - key: DEEPINFRA_API_KEY
        scope: RUN_TIME
        type: SECRET
      # Email (§B4). Sign-in is magic-link only, so with these unset **nobody can log
      # in** — the app falls back to the logging transport, which records a delivery
      # that never happened. SMTP_HOST and MAIL_FROM together arm the real mailer.
      # Any provider that speaks SMTP works (Resend, Postmark, SendGrid, Mailgun, SES).
      - key: SMTP_HOST
        scope: RUN_TIME
        value: "REPLACE_WITH_SMTP_HOST"
      - key: SMTP_USERNAME
        scope: RUN_TIME
        type: SECRET
      - key: SMTP_PASSWORD
        scope: RUN_TIME
        type: SECRET
      # Must be an address on a domain you have verified with the provider —
      # an unverified sender is the usual reason mail silently goes nowhere.
      - key: MAIL_FROM
        scope: RUN_TIME
        value: "REPLACE_WITH_FROM_ADDRESS"
      # Real DeepInfra model ids — the config/config.exs defaults are placeholders.
      # DEEPINFRA_MODEL is the workhorse (every turn); DEEPINFRA_MODEL_HEAVY is
      # reserved for character/world generation. Set both before the first run.
      - key: DEEPINFRA_MODEL
        scope: RUN_TIME
        value: "REPLACE_WITH_REAL_DEEPINFRA_MODEL"
      - key: DEEPINFRA_MODEL_HEAVY
        scope: RUN_TIME
        value: "REPLACE_WITH_REAL_DEEPINFRA_MODEL"
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${db.DATABASE_URL}
      - key: PHX_HOST
        scope: RUN_TIME
        value: ${APP_DOMAIN}
      # LiveView websocket origin check. If this is wrong the socket is rejected
      # ("Could not check origin …") and every button goes dead while pages still
      # render. `//*.ondigitalocean.app` accepts this app's default domain out of
      # the box regardless of how ${APP_DOMAIN} resolves. For a custom domain, set
      # this to your exact origin(s), comma-separated (e.g.
      # "https://app.example.com"), or "false" to disable the check during bring-up.
      # See docs/deployment.md.
      - key: CHECK_ORIGIN
        scope: RUN_TIME
        value: //*.ondigitalocean.app
      # DB connection budget. DO's dev-tier Postgres caps connections low (~20,
      # minus superuser-reserved). Repo + event-store pools + the eventstore/Oban
      # LISTEN connections must fit under it, or queries fail with
      # too_many_connections. These sizes suit a dev DB; raise them (and/or the DB
      # plan) as traffic and instance_count grow.
      - key: POOL_SIZE
        scope: RUN_TIME
        value: "5"
      - key: EVENT_STORE_POOL_SIZE
        scope: RUN_TIME
        value: "2"
      # Shows the full exception + stacktrace on 5xx error pages. On by decision, not
      # pending a change: the first users are alpha testers, and a stack trace in front
      # of one is worth more than the internals it reveals. Set "false" if you want it
      # off — but it is not a to-do. See PolyphonyWeb.ErrorHTML.
      - key: SHOW_ERROR_DETAILS
        scope: RUN_TIME
        value: "true"
      # Migrate + set up the event store on boot. This is the single migrator —
      # the web service runs Polyphony.Release.migrate/0 before it serves, so the
      # schema is guaranteed present. (There is deliberately no PRE_DEPLOY migrate
      # job: two migrators contend on the migration lock and can deadlock.) The
      # manual fallback is `bin/migrate` in the web component console. Idempotent.
      - key: MIGRATE_ON_BOOT
        scope: RUN_TIME
        value: "true"
      # Floating debug drawer that streams recent server logs into the browser
      # (copy + clear). Set to "true" to watch what the server does on a click
      # during bring-up; exposes raw logs, so keep it "false" once the app is
      # public. See Polyphony.DebugLog.
      - key: DEBUG_DRAWER
        scope: RUN_TIME
        value: "false"
      # Crash reporting (Sentry). Empty means off, and off is silent — a raise inside
      # a LiveView event becomes a flash for whoever hit it and reaches nobody else.
      # Paste a project DSN here (free tier is fine) and the boot log will say
      # "crash reporting ON". Payloads go through Polyphony.Redact, which strips
      # tokens and addresses and deliberately keeps the transcript.
      - key: SENTRY_DSN
        scope: RUN_TIME
        value: ""
      # Which build a crash report came from. App Platform has no SOURCE_COMMIT — the
      # bindable is COMMIT_HASH, and it resolves at build, so this is scoped to both
      # to guarantee it is present at run time. Unset is survivable: reports still
      # arrive, they just can't say which deploy produced them.
      - key: SENTRY_RELEASE
        scope: RUN_AND_BUILD_TIME
        value: "${_self.COMMIT_HASH}"

databases:
  - name: db
    engine: PG
    version: "16"
    # pgvector: the read-model migration runs `CREATE EXTENSION IF NOT EXISTS
    # vector;`. DO's managed Postgres 16 ships pgvector and the default admin role
    # can create it, so a release-time migrate is enough. The event store lives in
    # the same cluster under a dedicated `eventstore` schema (created by migrate).
