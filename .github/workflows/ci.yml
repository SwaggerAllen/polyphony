name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

# A push to a PR branch fires this twice (push + pull_request). Cancel the superseded
# run rather than paying for both, and cancel the previous commit's run while we're
# here — only the tip's result means anything.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # One place, so a toolchain bump is a one-line change across every job.
  OTP_VERSION: "27.3"
  ELIXIR_VERSION: "1.17.3-otp-27"

jobs:
  # Split into named jobs on purpose. As a single job called "format · compile · test"
  # the PR check list showed one row, so a failed format and a failed suite read
  # identically — and it wasn't obvious the suite ran at all.
  lint:
    name: format · compile · deps
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-lint-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-lint-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      # A dependency removed months ago lingers in mix.lock and keeps turning up in
      # advisory scans. Stale locks are also how a `deps.get` resolves differently on
      # a fresh clone than it does here.
      - run: mix deps.unlock --check-unused

  test:
    name: test suite
    runs-on: ubuntu-latest

    services:
      postgres:
        # pgvector image so `CREATE EXTENSION vector` (run by our migration) works.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get
      # The `test` alias creates + migrates the test DB (the migration enables
      # pgvector), then runs the suite. The LLM path stays offline (Mock/Stub
      # providers); only hex fetches touch the network.
      - run: mix test

  feature:
    name: browser end-to-end
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-test-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      # Wallaby drives a real Chrome over chromedriver, and chromedriver refuses to
      # drive a browser of a different major version. Installing both together is what
      # keeps them matched.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with:
          chrome-version: stable
          install-chromedriver: true

      - run: mix deps.get

      # The tier `Phoenix.LiveViewTest` cannot reach: a real LiveSocket over a real
      # WebSocket, real JS, real render. It proves the dramatic-irony guarantee end to
      # end — and it is the only check that can prove the CSP doesn't forbid our own
      # WebSocket, because a broken policy passes every in-process test and fails the
      # moment a browser loads the page.
      - name: Feature tests (Wallaby)
        env:
          WALLABY_CHROME_BINARY: ${{ steps.chrome.outputs.chrome-path }}
          WALLABY_CHROMEDRIVER: ${{ steps.chrome.outputs.chromedriver-path }}
        run: mix test --only feature

  assets:
    name: asset drift
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-lint-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-lint-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      # Verify the committed asset bundles are in sync with their source under
      # assets/. Fetches the esbuild/tailwind binaries, rebuilds, and fails if the
      # tracked outputs drift — so a change to assets/ (including a re-run of
      # `mix kit.port`) can't land without its rebuilt bundle.
      - run: mix assets.setup
      - run: mix assets.build
      - name: Assets are up to date
        run: |
          git diff --exit-code \
            priv/static/assets/app.css priv/static/assets/app.js \
            priv/static/assets/storybook.css priv/static/assets/storybook.js

  types:
    name: dialyzer
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-lint-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-lint-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      # The PLT is built from OTP plus every dependency and takes ~2 minutes, so it is
      # cached separately, keyed on mix.lock and on the **resolved** toolchain.
      # Resolved, not requested: `otp-version: "27.3"` is a range, and the runner
      # image moves within it (27.3.4.1 → 27.3.4.9) without the key changing — which
      # served a PLT dialyzer rejects outright as "Old PLT file".
      # `restore-keys` matters more than the exact hit: an almost-current PLT is
      # incrementally updated in seconds, while no PLT at all pays the full build.
      - uses: actions/cache@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-plt-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get
      # Split from the run so a PLT build failure reads as a PLT build failure, and so
      # the cache is written even when the analysis below finds something.
      - run: mix dialyzer --plt

      # A PLT is derived data, so a stale one must never read as a type error — and it
      # does by default: dialyxir's "PLT is up to date!" tracks *our* modules, not the
      # OTP the PLT was built against, so the step above passes and the analysis then
      # halts with `:dialyzer.run error: Old PLT file`. The key above is the fix; this
      # is the belt for the next time something slips past it. Only that one error is
      # retried — anything else is the analysis doing its job.
      - name: Analyse
        run: |
          set -o pipefail
          if ! mix dialyzer --format short 2>&1 | tee /tmp/dialyzer.log; then
            grep -q "Old PLT file" /tmp/dialyzer.log || exit 1
            echo "::warning::cached PLT was built against another OTP — rebuilding"
            rm -rf priv/plts
            mix dialyzer --format short
          fi

  audit:
    name: security audit
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-lint-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('**/mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-lint-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-

      - run: mix deps.get

      # Known vulnerabilities in the locked dependency tree.
      - run: mix deps.audit

      # Retired packages plus the OSV advisory feed — a different database from the
      # one `deps.audit` reads, so it genuinely finds different things. Non-blocking
      # *only* because cowlib 2.19.0 carries two advisories with no fixed release yet
      # (EEF-CVE-2026-43966, EEF-CVE-2026-43969); make this blocking as soon as one
      # ships. The log still shows everything it found.
      - name: Hex advisories (informational)
        continue-on-error: true
        run: mix hex.audit

      # Phoenix-aware static analysis: XSS via raw/1, CSRF, directory traversal,
      # secrets in config. `--skip` honours the `@sobelow_skip` annotations at the
      # three `binary_to_term` call sites, each of which already passes `:safe`.
      - run: mix sobelow --exit low --skip
